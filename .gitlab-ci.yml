stages:
  - init
  - build
  - deploy

# COnfigure authentication with Gitlab Identity Provider (OIDC)
image:
  name: hashicorp/terraform:1.13
  entrypoint: [""]

init:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  stage: init
  before_script:
  # install aws cli
  - apk --no-cache add curl python3 py3-pip
  - pip3 install --no-cache-dir awscli --break-system-packages

  # establish connection with AWS to get access credentials
  - >
    export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
    $(aws sts assume-role-with-web-identity
    --role-arn ${ROLE_ARN}
    --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
    --web-identity-token ${GITLAB_OIDC_TOKEN}
    --duration-seconds 3600
    --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
    --output text))
  - aws sts get-caller-identity

  script:
    - terraform init
  artifacts:
    paths:
      - .terraform/
      - .terraform.lock.hcl
  
build:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "https://gitlab.com"
  stage: build

  before_script:
  #install aws cli
  - apk --no-cache add curl python3 py3-pip
  - pip3 install --no-cache-dir awscli --break-system-packages

  # establish authentication with AWS to get access credentials
  #- echo "role arn ${ROLE_ARN}" #added for debugging
  #- echo "token ${GITLAB_OIDC_TOKEN}" 
  
  - >
    export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
    $(aws sts assume-role-with-web-identity
    --role-arn ${ROLE_ARN}
    --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
    --web-identity-token ${GITLAB_OIDC_TOKEN}
    --duration-seconds 3600
    --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
    --output text))

  - aws sts get-caller-identity

  script:
  - echo "Connected to AWS from Gitlab and retrieved credentials"
  #terraform flow
  - terraform plan -out "planfile" 
  artifacts:
    paths:
      - planfile

deploy:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "https://gitlab.com"
  stage: deploy

  before_script:
  #install aws cli
  - apk --no-cache add curl python3 py3-pip
  - pip3 install --no-cache-dir awscli --break-system-packages

  # establish authentication with AWS to get access credentials
  #- echo "role arn ${ROLE_ARN}" #added for debugging
  #- echo "token ${GITLAB_OIDC_TOKEN}" 
  
  - >
    export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
    $(aws sts assume-role-with-web-identity
    --role-arn ${ROLE_ARN}
    --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
    --web-identity-token ${GITLAB_OIDC_TOKEN}
    --duration-seconds 3600
    --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
    --output text))

  - aws sts get-caller-identity

  script:
  - terraform apply -input=false "planfile" 
  #when: manual. # to avoid auto deploy on every commit



