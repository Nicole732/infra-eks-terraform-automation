stages:
  - build

image:
  name: amazon/aws-cli:latest
  entrypoint: [""]

variables:
  AWS_REGION: us-east-1
  # ROLE_ARN should be set in Settings → CI/CD → Variables (masked/protected), e.g.:
  # arn:aws:iam::<ACCOUNT_ID>:role/GitlabCi

build:
  stage: build
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "https://gitlab.com"
  before_script:
    - set -euo pipefail

    # (Optional) Debug the token claims to compare with your trust policy:
    # - echo "$GITLAB_OIDC_TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null || true

    # Assume role with the GitLab OIDC token
    - |
      read AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<<"$(aws sts assume-role-with-web-identity \
        --role-arn "$ROLE_ARN" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "$GITLAB_OIDC_TOKEN" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)" || { echo "AssumeRoleWithWebIdentity failed"; exit 1; }

      export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN

    - aws sts get-caller-identity
  script:
    - echo "Connected to AWS from GitLab and retrieved credentials"
